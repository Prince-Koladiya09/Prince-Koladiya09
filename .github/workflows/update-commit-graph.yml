name: Update commit graph

on:
  schedule:
    - cron: "0 */12 * * *"      # twice a day
  workflow_dispatch:             # lets you run it manually from the Actions tab
  push:
    branches: [main]
    paths: ["scripts/**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build commit graph
        run: python scripts/build_commit_graph.py "${{ github.repository_owner }}" assets/commit-year.svg

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/commit-year.svg
          git diff --staged --quiet || (git commit -m "chore: refresh commit graph" && git push)
